name: Claude dev

# Implements an issue when a human labels it 'ready-for-dev', then opens a PR for review.
#
# The git work is done by shell steps, not by Claude. Two earlier runs finished green having
# produced nothing — no branch, no commit, no PR, no comment — because Claude drove git and gh
# through Bash and kept hitting tool-permission denials (16, then 10) that the action reports only
# as a count. Claude now edits files and nothing else; the steps around it create the branch and
# open the PR, and a step that fails turns the job red instead of green.
#
# Uses AGENT_TOKEN (a fine-grained PAT) rather than GITHUB_TOKEN, because a PR opened with
# GITHUB_TOKEN does not trigger other workflows — CI and the Gemini review would never run on it.

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  implement:
    if: github.event.label.name == 'ready-for-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH: claude/issue-${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ secrets.AGENT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the working branch
        run: |
          git config user.name "claude-dev[bot]"
          git config user.email "claude-dev[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Implement the issue
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_TOKEN }}
          # Puts a summary of what Claude did in the job summary. Without it, a run that changes
          # nothing gives you only a denial count and no way to see why.
          display_report: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Implement the change this issue asks for. Edit files only.

            Do NOT run git, do NOT commit, do NOT push, and do NOT open a pull request. The workflow
            does all of that for you after you finish. Your job is to leave correct edits in the
            working tree.

            Read CLAUDE.md first and follow it. Its hard rules are absolute: never use production
            credentials, never run SQL against any database, and never read or edit .env files.

            Steps:
            1. Read the issue: gh issue view ${{ github.event.issue.number }} --comments
            2. If the issue is too vague to implement, or asks for something the hard rules forbid,
               post a comment on the issue saying exactly what you need, and stop. Do not guess.
            3. Make the smallest change that resolves the issue. Match the style of the code around
               it. Do not reformat unrelated code or bump dependencies.
            4. Verify your work: npm run lint, npm run build, and npm run test:e2e must all pass.
               Fix what you broke. If a pre-existing failure blocks you, say so in a comment on the
               issue.
            5. If you changed or added a user-facing flow, add or extend a smoke test in e2e/.

            Finish by printing a short summary of what you changed and how you verified it. That
            summary becomes the pull request body.

            If what the issue refers to does not exist — a player name, a screen, a field you
            cannot find anywhere in the code — stop early. Say what you looked for, where you
            looked, and what you would need in order to proceed, as a comment on the issue. Do not
            keep searching. An exhaustive hunt for something that is not there burns the whole run
            and produces nothing, which is worse than asking.

            Never finish silently. If a command you need is refused by the tool permissions, or you
            cannot complete the task for any other reason, post a comment on the issue naming the
            exact command or permission you needed.
          # max-turns was 60, set when the only test case was a one-line lint fix. A styling change
          # spanning several files took 117 turns, and the action fails the step once the ceiling is
          # passed — so six minutes of correct work and $1.44 were discarded at the finish line,
          # with the commit step skipped and nothing left behind. Keep this comment out of the block
          # below: claude_args is a literal scalar, so a # line inside it reaches the CLI as an
          # argument rather than being stripped.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 150
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,TodoWrite,Bash"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(gh pr create:*),Bash(gh pr merge:*)"

      # A failed agent step skips everything after it, including the comment the prompt asks for —
      # so a dead run left no trace anywhere except a log archive someone had to download. Now the
      # issue itself says the run died.
      - name: Say so on the issue if the agent failed
        if: always() && steps.claude.outcome == 'failure'
        env:
          AGENT_TOKEN_RAW: ${{ secrets.AGENT_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$AGENT_TOKEN_RAW" | tr -d '\r\n')"
          echo "::add-mask::$TOKEN"
          export GH_TOKEN="$TOKEN"
          gh issue comment "$ISSUE_NUMBER" --body "$(printf 'The dev agent failed on this issue and left nothing behind — no branch, no pull request.\n\nRun: %s\n\nThe issue is still open. Remove and re-apply the ready-for-dev label to try again once the cause is understood.' "$RUN_URL")" \
            || echo "::warning::could not comment on the issue either"

      - name: Commit, push and open the pull request
        run: |
          # A secret pasted with a trailing newline breaks everything downstream: the Claude action
          # bakes the token into the remote URL, and git refuses to parse a credential URL
          # containing a newline ("fatal: credential url cannot be parsed", exit 128) — after the
          # commit has already succeeded. gh fails the same way. Trim it and rebuild the remote so
          # a stray newline in the stored secret can never break the push again.
          TOKEN="$(printf '%s' "$AGENT_TOKEN_RAW" | tr -d '\r\n')"
          echo "::add-mask::$TOKEN"
          export GH_TOKEN="$TOKEN"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Log the working tree first, so this step explains itself even if a later command dies.
          # bash -e aborts on the first failure, so a failing `gh issue comment` would otherwise
          # take the diagnostic with it and leave a red job with no stated reason.
          echo "::group::working tree"
          git status --short || true
          git --no-pager diff --stat || true
          echo "::endgroup::"

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Claude produced no file changes — see the Claude Code Report in this run's summary"
            gh issue comment "$ISSUE_NUMBER" --body "The dev agent ran but left no file changes. Run: $RUN_URL" \
              || echo "::warning::could not post the issue comment either"
            exit 1
          fi

          git add -A
          git commit -m "$(printf '%s\n\n%s' "$ISSUE_TITLE" "Closes #$ISSUE_NUMBER")"
          echo "::group::pushing $BRANCH"
          git push -u origin "$BRANCH"
          echo "::endgroup::"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$ISSUE_TITLE" \
            --body "$(printf 'Implements #%s.\n\nWritten by the dev agent. What it changed and how it verified the work is in the [run summary](%s).\n\nThis merges itself once CI passes, so review happens after the fact — revert from this page if it is wrong.\n\nCloses #%s' "$ISSUE_NUMBER" "$RUN_URL" "$ISSUE_NUMBER")")
          echo "opened $PR_URL"

          # Hand the merge to GitHub rather than deciding here: it merges when the required check
          # passes, and never before. --auto errors when the PR is already mergeable with nothing
          # left to wait for, so fall back to merging outright in that case.
          echo "::group::enabling auto-merge"
          gh pr merge "$PR_URL" --auto --squash --delete-branch \
            || gh pr merge "$PR_URL" --squash --delete-branch
          echo "::endgroup::"
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          AGENT_TOKEN_RAW: ${{ secrets.AGENT_TOKEN }}
