name: Gemini ping

# Manual check that the Gemini reviewer's key and model answer.
#
# `review` is a required check, so when Gemini gives no reply nothing can merge, and the only way
# to try again used to be a pull request. This asks the same model one short question over the
# same plain HTTPS request the review uses (gemini-review.yml) and prints what came back:
#
#   a reply                 -> the key and the model work; a failing review is about the diff
#   HTTP 400 / 401 / 403    -> the key: missing, wrong, or saved with stray whitespace
#   HTTP 404                -> the model has been retired; change GEMINI_MODEL in gemini-review.yml
#   HTTP 429 / 5xx          -> Gemini is busy or down; try again later
#
# It posts nothing and holds no write permission. It used to go through Google's run-gemini-cli
# action and ask Gemini to post a comment through the GitHub MCP server, to find out why the
# reviewer posted nothing. The review dropped both on 2026-10-01, so that check tested a path
# nothing uses any more.
#
# Run it from the Actions tab: "Gemini ping" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Question to ask Gemini'
        required: true
        default: 'In one sentence, what is a Nassau in golf?'

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ask Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QUESTION: ${{ inputs.question }}
        run: |
          # The model the review uses, read from the review so there is one place to change it.
          MODEL=$(sed -n 's/^ *GEMINI_MODEL: *//p' .github/workflows/gemini-review.yml | head -n 1)
          if [ -z "$MODEL" ]; then
            echo "::error::could not read GEMINI_MODEL from gemini-review.yml"
            exit 1
          fi
          echo "### Gemini ping — $MODEL" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY is not available to this run"
            exit 1
          fi
          # Trimmed for the same reason as in the review: a key saved with a trailing newline
          # breaks the request headers and Google answers 400 to a body that is good JSON.
          KEY="$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]')"
          echo "::add-mask::$KEY"
          [ "$KEY" = "$GEMINI_API_KEY" ] || echo "::warning::GEMINI_API_KEY is stored with stray whitespace — re-save the secret without it"

          jq -n --arg text "$QUESTION" '{ contents: [ { role: "user", parts: [ { text: $text } ] } ] }' \
            > "$RUNNER_TEMP/request.json"

          CODE=$(curl -sS -m 60 -o "$RUNNER_TEMP/response.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: ${KEY}" \
            --data-binary "@$RUNNER_TEMP/request.json" \
            "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent") || CODE=000
          echo "HTTP $CODE"

          if [ "$CODE" != "200" ]; then
            MESSAGE=$(jq -r '.error.message // empty' "$RUNNER_TEMP/response.json" 2>/dev/null | head -c 500)
            echo "HTTP $CODE from $MODEL: ${MESSAGE:-no message}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::Gemini did not answer — HTTP $CODE ${MESSAGE}"
            exit 1
          fi

          REPLY=$(jq -r '[.candidates[0].content.parts[]? | select(.thought != true) | .text // empty] | join("")' "$RUNNER_TEMP/response.json")
          if [ -z "${REPLY//[[:space:]]/}" ]; then
            REASON=$(jq -r '.candidates[0].finishReason // .promptFeedback.blockReason // "unknown"' "$RUNNER_TEMP/response.json")
            echo "HTTP 200 but no text. Finish reason: $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::Gemini answered with no text ($REASON)"
            exit 1
          fi
          { echo; echo "$REPLY"; } | tee -a "$GITHUB_STEP_SUMMARY"
