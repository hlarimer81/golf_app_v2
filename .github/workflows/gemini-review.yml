name: Gemini review

# Second opinion on every PR, from a different model than the one that wrote the code.
# Adapted from google-github-actions/run-gemini-cli's own pr-review example, which posts its
# review through the GitHub MCP server rather than by shelling out to gh.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Review the pull request
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The extension's prompt reads these as "Additional User Instructions".
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          ADDITIONAL_CONTEXT: >-
            Always submit the review, even when you find nothing wrong. A pull request with no
            problems gets a summary saying so in one line. Never finish without posting: silence is
            indistinguishable from a broken reviewer, and a reviewer nobody can tell is working is
            worth nothing. This project is a golf scoring app whose users enter scores one-handed on
            a phone in bright sun, so weigh phone-width layout and tap targets accordingly, and read
            CLAUDE.md for the rules the code is meant to follow.
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ github.event.pull_request.number }}
          settings: |
            {
              "model": { "maxSessionTurns": 25 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:v0.27.0"],
                  "includeTools": ["create_pending_pull_request_review", "add_comment_to_pending_review", "submit_pending_pull_request_review", "pull_request_read", "pull_request_review_write", "add_issue_comment"],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": { "core": [] }
            }
          extensions: |
            ["https://github.com/gemini-cli-extensions/code-review"]
          prompt: '/pr-code-review'
