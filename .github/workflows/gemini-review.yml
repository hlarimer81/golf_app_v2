name: Gemini review

# Second opinion on every PR, from a different model than the one that wrote the code.
#
# The model reviews; the workflow posts. Four runs went green while posting nothing, because the
# review was published through the GitHub MCP server and every failure there is invisible from
# outside. Now the diff goes in as text, Gemini's reply comes back as a step output, and a shell
# step comments with gh. An empty reply fails the job — the same rule the dev agent follows.
#
# The cost is per-line inline comments, which the MCP path promised and never delivered. One
# summary comment that actually appears is worth more.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect the diff
        id: diff
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch -q origin "${{ github.event.pull_request.base.ref }}"
          {
            echo 'diff<<GEMINI_DIFF_EOF'
            git diff "$BASE...HEAD" -- . ':(exclude)package-lock.json' | head -c 120000
            echo
            echo 'GEMINI_DIFF_EOF'
          } >> "$GITHUB_OUTPUT"

          echo "changed files:"
          git diff --stat "$BASE...HEAD"

      - name: Review the diff
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          settings: |
            {
              "model": { "maxSessionTurns": 3 },
              "tools": { "core": [] }
            }
          prompt: |
            You are reviewing a pull request for 4Play, a golf scoring web app (React + Vite +
            Supabase). Its users enter scores one-handed on a phone, outdoors in bright sun, while
            playing — so phone-width layout, tap target size and contrast matter as much as
            correctness. Money is settled off these scores, so scoring and handicap maths deserve
            real scrutiny.

            Review the diff below. Comment only on what the diff actually changes.

            Answer in GitHub markdown, under 300 words, in this shape:

            **Verdict:** one line — approve, approve with nits, or needs changes.

            **Findings:** a short bullet per issue, most serious first, each naming the file and
            saying what breaks and when. If you find nothing wrong, write "No concerns." and say so
            plainly rather than inventing work.

            Do not restate what the diff does — the author knows. Be specific or be brief.

            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

      - name: Post the review
        if: always()
        run: |
          {
            echo "### Gemini review"
            echo
            echo "${REPLY:-(empty)}"
            echo
            echo "**Errors:** ${ERRORS:-(none)}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${REPLY// /}" ]; then
            echo "::error::Gemini returned no reply — the reviewer is not working, whatever the step status says"
            exit 1
          fi

          printf '%s\n\n---\n*Reviewed by Gemini. [Run](%s/%s/actions/runs/%s)*\n' \
            "$REPLY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            | gh pr comment "$PR_NUMBER" --body-file -
        env:
          REPLY: ${{ steps.gemini.outputs.summary }}
          ERRORS: ${{ steps.gemini.outputs.error }}
